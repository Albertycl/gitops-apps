# admin.albertycliu.xyz and the /admin paths of diag.albertycliu.xyz are protected by Traefik basic auth. The htpasswd Secret
# "admin-basic-auth" (key: users) is created by hand and is not stored in Git.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: admin-basic-auth
spec:
  basicAuth:
    secret: admin-basic-auth
    removeHeader: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: admin
spec:
  entryPoints: [websecure]
  routes:
  - kind: Rule
    match: Host(`admin.albertycliu.xyz`)
    middlewares:
    - name: admin-basic-auth
    services:
    - name: admin-frontend
      port: 80
  tls: {}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: diag
spec:
  entryPoints: [websecure]
  routes:
  - kind: Rule
    match: Host(`diag.albertycliu.xyz`)
    services:
    - name: user-frontend
      port: 80
  - kind: Rule
    match: Host(`diag.albertycliu.xyz`) && (PathPrefix(`/admin`) || PathPrefix(`/api/admin`))
    priority: 100
    middlewares:
    - name: admin-basic-auth
    services:
    - name: user-frontend
      port: 80
  tls: {}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: http-redirect
spec:
  entryPoints: [web]
  routes:
  - kind: Rule
    match: Host(`admin.albertycliu.xyz`) || Host(`diag.albertycliu.xyz`)
    middlewares:
    - name: redirect-https
    services:
    - name: noop@internal
      kind: TraefikService
