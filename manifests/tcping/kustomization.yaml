apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tcping
resources:
- namespace.yaml
- mariadb.yaml
- apps.yaml
- ingress.yaml
- certificate.yaml
configMapGenerator:
- files:
  - seed.sql
  name: tcping-seed
generatorOptions:
  disableNameSuffixHash: true
images:
- name: ghcr.io/albertycl/tcping-backend
