apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tcping
resources:
- namespace.yaml
- mariadb.yaml
- apps.yaml
- ingress.yaml
- certificate.yaml
configMapGenerator:
- name: tcping-seed
  files:
  - seed.sql
generatorOptions:
  disableNameSuffixHash: true
images:
- name: ghcr.io/albertycl/tcping-backend
  newName: ghcr.io/albertycl/tcping-backend
  newTag: latest
- name: ghcr.io/albertycl/tcping-frontend
  newName: ghcr.io/albertycl/tcping-frontend
  newTag: latest
